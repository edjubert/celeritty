[package]
name = "terminal-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib for wasm-pack, rlib so `cargo test` can link it natively.
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
alacritty_terminal = { path = "vendor/alacritty_terminal", default-features = false }
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
